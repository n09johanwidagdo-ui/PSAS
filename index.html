<!DOCTYPE html>
<html lang="id"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nilai Siswa SMKN 2 Pati</title><meta charset="utf-8">
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--pri:#1e3a8a;--acc:#0d9488;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,#1e3a8a,#0d9488);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
header h1{margin:0;font-size:18px}header small{opacity:.85}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{background:rgba(255,255,255,.15);color:#fff;border:0;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:14px}
nav button.on{background:#fff;color:var(--pri);font-weight:600}
main{max-width:1100px;margin:18px auto;padding:0 14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.row label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
select,input,textarea{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}
button.b{background:var(--pri);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit}button.b.g{background:var(--acc)}button.b.r{background:#dc2626}button.b.l{background:#e2e8f0;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}.stat{background:#f8fafc;border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:22px;color:var(--pri)}.stat span{font-size:12px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:14px;height:210px;padding:10px 6px 0;border-bottom:2px solid var(--line)}.bw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:28px}
.bar{width:100%;max-width:70px;border-radius:6px 6px 0 0;background:linear-gradient(var(--acc),var(--pri));transition:height .5s;position:relative;min-height:2px}.bar i{position:absolute;top:-18px;width:100%;text-align:center;font-size:12px;font-style:normal;font-weight:600}
.lbl{display:flex;gap:14px;padding:4px 6px;font-size:12px;color:var(--mut)}.lbl span{flex:1;text-align:center;min-width:28px}
h3{margin:4px 0 10px;font-size:15px}table.t{width:100%;border-collapse:collapse;font-size:14px}table.t th{background:#f1f5f9;text-align:left;padding:8px;font-size:12px}table.t td{padding:6px 8px;border-top:1px solid var(--line)}
table.t input{width:100%;padding:5px 7px}table.t input.n{width:70px;text-align:center}.sc{overflow-x:auto}
.hide{display:none}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:9}#toast.on{opacity:1}#toast.er{background:#dc2626}
.sheet{position:relative;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;padding:18px 24px;border:1px solid var(--line);font-size:10pt}
.sheet .lo{position:absolute;left:24px;top:14px;width:17mm}.sheet h2{text-align:center;font-size:11pt;margin:0 0 14px;line-height:1.35}.sheet .inf td{padding:1px 0;font-weight:bold;font-size:10pt}
.sheet table.lg{width:100%;border-collapse:collapse;margin-top:10px}.sheet .lg th,.sheet .lg td{border:1px solid #000;padding:0 5px;height:var(--rh,6mm);font-size:var(--fs,9pt)}.sheet .lg th{background:#f3f3f3;font-weight:normal}
.sheet .ft{width:100%;margin-top:14px;font-size:9pt}.sheet .ft td{vertical-align:top;width:50%}
.su th{position:sticky;top:0;background:#f1f5f9;z-index:2;font-size:11px;vertical-align:bottom}.su td{padding:3px 5px}.su .mh{min-width:78px;text-align:center}.su td:nth-child(n+5){text-align:center}
.su .s1,.su .s2,.su .s3{position:sticky;background:#fff;z-index:1}.su th.s1,.su th.s2,.su th.s3{z-index:3;background:#f1f5f9}.su .s1{left:0;min-width:36px}.su .s2{left:36px;min-width:64px}.su .s3{left:100px;min-width:210px}
.su tr.nk td{border-top:2px solid #94a3b8}.su input.n{width:58px}.z0{background:#fee2e2!important}.z1{background:#fef3c7!important}.z2{background:#dcfce7!important}.kz,.kb{font-weight:600}.lg2{font-size:12px;color:var(--mut);margin:10px 0}.lg2 span{padding:2px 8px;border-radius:6px;margin-right:6px}
@page{size:A4 portrait;margin:12mm}
@media print{body.printing *{visibility:hidden}body.printing .pr,body.printing .pr *{visibility:visible}.pr{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none;padding:0}.pr .lo{left:0;top:0}}
</style></head><body>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const API_URL='https://script.google.com/macros/s/AKfycbyMHoluB7umt5Hrw-OF2js2RToEhMHMzO3OJjjNtch_kFs_zoam-mmXKmSB6WdTCSpr/exec'; // URL Web App Apps Script (berakhiran /exec)
const rpc=(f,...a)=>fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:f,args:a})}).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error);return j.data}).catch(e=>{toast(String(e.message).replace('Error: ',''),1);throw e});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pred=n=>n===''||n==null?'':n<=59?'D':n<=69?'C':n<=74?'B-':n<=79?'B':n<=84?'B+':n<=89?'A-':n<=94?'A':'A+', tg=k=>k.split(' ')[0];
const opt=(a,s)=>a.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${v==s?'selected':''}>${esc(l)}</option>`}).join('');
function toast(m,e){const t=$('#toast');t.textContent=m;t.className='on'+(e?' er':'');setTimeout(()=>t.className='',2600)}
let D,TOK=null,page='home';
const allMapel=()=>[].concat(D.mapel.X,D.mapel.XI,D.mapel.XII);
const mOpts=(t)=>(t?[t]:['X','XI','XII']).map(x=>`<optgroup label="Kelas ${x}">${opt(D.mapel[x].map(m=>[m,m]))}</optgroup>`).join('');

rpc('init').then(d=>{D=d;
 const J=[['','Semua Jurusan'],...Object.keys(D.jur).map(c=>[c,D.jur[c][0]])];
 $('#hm').innerHTML=mOpts();$('#hj').innerHTML=opt(J);$('#lj').innerHTML=opt(Object.keys(D.jur).map(c=>[c,D.jur[c][0]]));
 ['hm','hj','hk','hs'].forEach(i=>$('#'+i).onchange=i=='hk'||i=='hs'?stat:()=>{hk();stat()});
 $('#lt').onchange=lm;lm();hk();stat();nav();suInit(J);rkInit();
 $('#q').onkeydown=e=>{if(e.key=='Enter')cari()};
});
function nav(){const p=[['home','📊 Beranda'],['susulan','📝 Susulan'],['rank','🏆 Peringkat'],['cari','🔍 Cari Siswa'],['legger','🖨 Legger PSAS'],['admin',TOK?'⚙ Admin':'🔐 Admin']];
 $('#nav').innerHTML=p.map(x=>`<button class="${x[0]==page?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
 $$('main>section').forEach(s=>s.classList.toggle('hide',s.id!='p-'+page))}
function go(p){page=p;nav();if(p=='admin')adm();if(p=='susulan')su();if(p=='rank')rk()}
function hk(){const t=tg($('#hm').value),j=$('#hj').value;$('#hk').innerHTML=opt([['','Semua Kelas'],...D.kelas.filter(k=>k.t==t&&(!j||k.c==j)).map(k=>k.k)])}
function bars(el,lb,vals,max,fmt){const m=max||Math.max(1,...vals);$(el).innerHTML=vals.map(v=>`<div class="bw"><div class="bar" style="height:${v/m*88}%"><i>${fmt?fmt(v):v}</i></div></div>`).join('');$(lb).innerHTML=lb&&lb.map?'':lb.l.map(x=>`<span>${x}</span>`).join('')}
function drawBars(el,lel,labels,vals,max){const m=max||Math.max(1,...vals);$(el).innerHTML=vals.map(v=>`<div class="bw"><div class="bar" style="height:${v/m*88}%"><i>${v}</i></div></div>`).join('')||'<p style="color:#64748b">Belum ada data</p>';$(lel).innerHTML=labels.map(x=>`<span>${x}</span>`).join('')}
async function stat(){const s=await rpc('statistik',$('#hm').value,$('#hj').value,$('#hk').value,$('#hs').value);
 $('#hst').innerHTML=[['Siswa',s.siswa],['Sudah Dinilai',s.n],['Rata-rata',s.avg],['Tertinggi',s.max],['Terendah',s.min],['Tuntas (≥'+D.kkm+')',s.tuntas+'%']].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
 drawBars('#hb','#hl',['<60','60-69','70-79','80-89','90-100'],s.bins);drawBars('#hb2','#hl2',s.kelas.map(k=>k.k),s.kelas.map(k=>k.avg),100);
 $('#hbc').textContent='('+s.belum.length+' siswa)';
 $('#hbl').innerHTML=s.belum.length?`<table class="t"><tr><th>No</th><th>NIS</th><th>Nama</th><th>Kelas</th></tr>${s.belum.map((x,i)=>`<tr><td>${i+1}</td><td>${x.nis}</td><td>${esc(x.nama)}</td><td>${esc(x.kelas)}</td></tr>`).join('')}</table>`:'<p style="color:#0d9488;margin:6px">✅ Semua siswa sudah memiliki nilai.</p>'}

async function cari(){const r=await rpc('cari',$('#q').value);
 $('#qr').innerHTML=r.length?r.map((s,i)=>`<div class="card pr" id="sc${i}"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${esc(s.nama)}</h3><small>NIS ${s.nis} • Kelas ${s.kelas}</small></div><button class="b g noprint" onclick="pr('sc${i}')">🖨 Cetak Nilai</button></div>
 <div class="sc"><table class="t" style="margin-top:10px"><tr><th>No</th><th>Mata Pelajaran</th><th>Gasal</th><th>Genap</th></tr>${s.nilai.map((n,j)=>`<tr><td>${j+1}</td><td>${esc(n.mapel)}</td><td>${n.g}</td><td>${n.e}</td></tr>`).join('')}</table></div></div>`).join(''):'<div class="card">Tidak ada data. Masukkan minimal 2 huruf nama atau NIS lengkap.</div>'}
function pr(id){const e=document.getElementById(id);e.classList.add('pr');document.body.classList.add('printing');$$('.noprint').forEach(x=>x.style.display='none');window.print();$$('.noprint').forEach(x=>x.style.display='');document.body.classList.remove('printing')}

// ===== LEGGER =====
function lm(){$('#lm').innerHTML=opt([['','(Kosongkan - isi manual)'],...D.mapel[$('#lt').value]])}
async function lg(){const t=$('#lt').value,j=$('#lj').value,r=$('#lr').value,s=$('#ls').value,m=$('#lm').value,k=`${t} ${j}${r}`;
 const rows=await rpc('getKelas',k,m),w=D.wali[k]||['',''],n=rows.length+2,rh=Math.min(7,Math.max(4.2,170/(n+1)));
 const sh=$('#sheet');sh.style.display='block';sh.style.setProperty('--rh',rh+'mm');sh.style.setProperty('--fs',rh<5?'8pt':'9pt');
 let b=rows.map((x,i)=>{const v=s=='Genap'?x.e:x.g;return `<tr><td align="center">${i+1}</td><td align="center">${x.nis}</td><td>${esc(x.nama)}</td><td align="center">${v}</td><td align="center">${pred(v)}</td><td>${v===''?'':v>=D.kkm?'Tuntas':'Belum Tuntas'}</td></tr>`}).join('');
 b+='<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>'.repeat(2);
 sh.innerHTML=`<img class="lo" src="${$('#logo').src}"><h2>DAFTAR NILAI PENILAIAN SUMATIF AKHIR SEMESTER<br>SMK NEGERI 2 PATI</h2>
 <table class="inf"><tr><td width="130">Program Keahlian</td><td width="20">:</td><td>${esc(D.jur[j][1])}</td></tr><tr><td>Mata Pelajaran</td><td>:</td><td>${esc(m?m.substring(t.length+1):'……………………………')}</td></tr><tr><td>Kelas / Semester</td><td>:</td><td>${t}-${j}${r} &nbsp; / ${s}</td></tr></table>

async function lprint(){if(!$('#sheet').innerHTML)await lg();
 if($('#lf').value=='p'){pr('sheet');return}

// ===== SUSULAN =====
const cn=v=>v===''?'z0':v<D.kkm?'z1':'z2';let SU=null;
function suInit(J){$('#uj').innerHTML=opt(J);['ut','uj','ur','us'].forEach(i=>$('#'+i).onchange=su);$('#uf').onchange=suR;$('#uq').oninput=suR;
 $('#ub').addEventListener('input',e=>{const i=e.target;if(i.tagName!='INPUT')return;const tr=i.closest('tr'),ins=[...tr.querySelectorAll('input')];i.parentNode.className=cn(i.value===''?'':+i.value);tr.querySelector('.kz').textContent=ins.filter(x=>x.value==='').length;tr.querySelector('.kb').textContent=ins.filter(x=>x.value!==''&&+x.value<D.kkm).length});
 $('#ub').addEventListener('keydown',e=>{if(e.key!='Enter'||e.target.tagName!='INPUT')return;e.preventDefault();const n=$(`#ub input[data-r="${+e.target.dataset.r+1}"][data-c="${e.target.dataset.c}"]`);if(n){n.focus();n.select()}})}
async function su(){$('#usv').classList.toggle('hide',!TOK);SU=await rpc('susulan',$('#ut').value,$('#uj').value,$('#ur').value,$('#us').value);suR()}
function suR(){if(!SU)return;const f=$('#uf').value,q=$('#uq').value.toLowerCase(),ed=!!TOK;
 const rows=SU.rows.filter(r=>(!q||r.nama.toLowerCase().includes(q)||r.nis.includes(q))&&(f=='a'||(f=='k'?r.v.some(v=>v===''):r.v.some(v=>v!==''&&v<D.kkm))));
 const miss=SU.mapel.map((_,j)=>SU.rows.filter(r=>r.v[j]==='').length);let pk='';
 $('#usi').textContent=`Menampilkan ${rows.length} dari ${SU.rows.length} siswa`;
 $('#ub').innerHTML=`<table class="t su"><thead><tr><th class="s1">No</th><th class="s2">Kelas</th><th class="s3">Nama</th><th>NIS</th>${SU.mapel.map((m,j)=>`<th class="mh" title="${esc(SU.sheets[j])}">${esc(m.replace(/^[AB]\. /,''))}<br><small>kosong: ${miss[j]}</small></th>`).join('')}<th>Kosong</th><th>&lt;KKM</th></tr></thead><tbody>${rows.map((r,i)=>{const nk=r.kelas!=pk;pk=r.kelas;
 return `<tr class="${nk?'nk':''}" data-n="${r.nis}"><td class="s1">${i+1}</td><td class="s2">${r.kelas}</td><td class="s3">${esc(r.nama)}</td><td>${r.nis}</td>${r.v.map((v,j)=>`<td class="${cn(v)}">${ed?`<input class="n" type="number" min="0" max="100" data-r="${i}" data-c="${j}" data-o="${v}" value="${v}">`:v===''?'–':v}</td>`).join('')}<td class="kz">${r.v.filter(v=>v==='').length}</td><td class="kb">${r.v.filter(v=>v!==''&&v<D.kkm).length}</td></tr>`}).join('')}</tbody></table>`}
async function saveSu(){const ch=[];$$('#ub input').forEach(i=>{if(i.value!==i.dataset.o)ch.push({sheet:SU.sheets[i.dataset.c],nis:i.closest('tr').dataset.n,v:i.value})});
 if(!ch.length)return toast('Tidak ada perubahan');toast(await rpc('saveSusulan',TOK,$('#us').value,ch));su()}
// ===== PERINGKAT =====
function rkInit(){$('#gj').innerHTML=opt(Object.keys(D.jur).map(c=>[c,D.jur[c][0]]));$('#gt').onchange=()=>{gm();rk()};['gl','gj','gr','gm','gs'].forEach(i=>$('#'+i).onchange=()=>{gv();rk()});gm();gv()}
function gm(){$('#gm').innerHTML=opt([['','Seluruh Mata Pelajaran (rata-rata)'],...D.mapel[$('#gt').value]])}
function gv(){const l=$('#gl').value;$('#gjw').style.display=l=='angkatan'?'none':'';$('#grw').style.display=l=='kelas'?'':'none'}
async function rk(){const l=$('#gl').value,t=$('#gt').value,j=$('#gj').value,m=$('#gm').value,x=l!='kelas';
 const r=await rpc('peringkat',t,l,j,`${t} ${j}${$('#gr').value}`,m,$('#gs').value),md=['🥇','🥈','🥉'];
 $('#gb').innerHTML=r.rows.length?`<table class="t"><tr><th>Peringkat</th><th>NIS</th><th>Nama</th><th>Kelas</th>${x?'<th>Rank Kelas</th>':''}<th>${m?'Nilai':'Rata-rata'}</th>${m?'':'<th>Jumlah</th><th>Mapel Terisi</th>'}</tr>${r.rows.map(s=>`<tr><td><b>${md[s.rank-1]||s.rank}</b></td><td>${s.nis}</td><td>${esc(s.nama)}</td><td>${s.kelas}</td>${x?`<td>${s.rk}</td>`:''}<td><b>${m?s.avg:s.avg.toFixed(2)}</b></td>${m?'':`<td>${s.jml}</td><td>${s.n}/${r.tot}</td>`}</tr>`).join('')}</table>`:'<p style="color:#64748b">Belum ada nilai pada lingkup ini.</p>'}
// ===== ADMIN =====
let at='nilai';
function adm(){if(!TOK){$('#p-admin').innerHTML=`<div class="card" style="max-width:360px;margin:auto"><h3>Login Admin</h3><div class="row"><label style="flex:1">Kata sandi<input type="password" id="pw" onkeydown="if(event.key=='Enter')dologin()"></label><button class="b" onclick="dologin()">Masuk</button></div></div>`;return}
 $('#p-admin').innerHTML=`<div class="card"><div class="row"><button class="b ${at=='nilai'?'':'l'}" onclick="at='nilai';adm()">Nilai</button><button class="b ${at=='siswa'?'':'l'}" onclick="at='siswa';adm()">Siswa</button><button class="b ${at=='mapel'?'':'l'}" onclick="at='mapel';adm()">Mata Pelajaran</button><button class="b ${at=='wali'?'':'l'}" onclick="at='wali';adm()">Wali Kelas</button><button class="b l" onclick="TOK=null;nav();adm()">Keluar</button></div></div><div id="ab"></div>`;
 ({nilai:aNilai,siswa:aSiswa,mapel:aMapel,wali:aWali})[at]()}
async function dologin(){TOK=await rpc('login',$('#pw').value);nav();adm()}
const kOpts=s=>opt(D.kelas.map(k=>k.k),s);
function aNilai(){$('#ab').innerHTML=`<div class="card"><div class="row"><label>Mata Pelajaran<select id="am" style="min-width:260px">${mOpts()}</select></label><label>Kelas<select id="ak">${kOpts('X D3')}</select></label><button class="b" onclick="loadN()">Tampilkan</button><button class="b g" onclick="saveN()">💾 Simpan</button></div><div class="sc" id="an" style="margin-top:12px"></div></div>`;
 $('#am').onchange=()=>{const t=tg($('#am').value);$('#ak').innerHTML=opt(D.kelas.filter(k=>k.t==t).map(k=>k.k))};$('#am').onchange();loadN()}
let NR=[];
async function loadN(){NR=await rpc('getKelas',$('#ak').value,$('#am').value);
 $('#an').innerHTML=`<table class="t"><tr><th>No</th><th>NIS</th><th>Nama</th><th>Gasal</th><th>Genap</th><th></th></tr>${NR.map((r,i)=>`<tr><td>${i+1}</td><td>${r.nis}</td><td>${esc(r.nama)}</td><td><input class="n" type="number" min="0" max="100" id="g${i}" value="${r.g}"></td><td><input class="n" type="number" min="0" max="100" id="e${i}" value="${r.e}"></td><td><button class="b r" title="Hapus nilai" onclick="g${i}.value='';e${i}.value=''">🗑</button></td></tr>`).join('')||'<tr><td colspan=6>Belum ada siswa di kelas ini</td></tr>'}</table>`}
async function saveN(){const rows=NR.map((r,i)=>({nis:r.nis,nama:r.nama,kelas:r.kelas,g:$('#g'+i).value,e:$('#e'+i).value}));toast(await rpc('saveNilai',TOK,$('#am').value,rows))}
function aSiswa(){$('#ab').innerHTML=`<div class="card"><div class="row"><label>Kelas<select id="sk" onchange="loadS()">${kOpts('X D3')}</select></label><button class="b g" onclick="addS()">＋ Tambah Siswa</button></div><div class="sc" id="sl" style="margin-top:12px"></div>
 <h3 style="margin-top:16px">Impor massal (tempel: NIS [tab] Nama, satu siswa per baris)</h3><textarea id="imp" rows="4" style="width:100%"></textarea><br><button class="b" style="margin-top:8px" onclick="imp()">Impor ke kelas terpilih</button></div>`;loadS()}
async function loadS(){const r=await rpc('listSiswa',TOK,$('#sk').value);renS(r)}
function renS(r){$('#sl').innerHTML=`<table class="t"><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th></th></tr>${r.map(x=>row(x.nis,x.nama,x.kelas)).join('')}</table>`}
const row=(n,m,k)=>`<tr data-o="${n}"><td><input value="${esc(n)}" style="width:90px"></td><td><input value="${esc(m)}"></td><td><select>${kOpts(k)}</select></td><td style="white-space:nowrap"><button class="b" onclick="svS(this)">Simpan</button> <button class="b r" onclick="dlS(this)">Hapus</button></td></tr>`;
function addS(){$('#sl').querySelector('table').insertAdjacentHTML('beforeend',row('','',$('#sk').value))}
async function svS(b){const tr=b.closest('tr'),i=tr.querySelectorAll('input'),s=tr.querySelector('select');toast(await rpc('saveSiswa',TOK,tr.dataset.o,i[0].value,i[1].value,s.value));loadS()}
async function dlS(b){const tr=b.closest('tr');if(!tr.dataset.o)return tr.remove();if(!confirm('Hapus siswa beserta seluruh nilainya?'))return;toast(await rpc('delSiswa',TOK,tr.dataset.o));loadS()}
async function imp(){toast(await rpc('importSiswa',TOK,$('#sk').value,$('#imp').value));$('#imp').value='';loadS()}
function aMapel(){$('#ab').innerHTML=`<div class="card"><div class="row"><label>Kelas<select id="mt"><option>X</option><option>XI</option><option>XII</option></select></label><label style="flex:1">Nama Mata Pelajaran<input id="mn" placeholder="mis. B. Seni Budaya"></label><button class="b g" onclick="addM()">＋ Tambah</button></div>
 <div class="sc" style="margin-top:12px"><table class="t"><tr><th>Kelas</th><th>Mata Pelajaran</th><th></th></tr>${['X','XI','XII'].map(t=>D.mapel[t].map(s=>`<tr data-s="${esc(s)}"><td>${t}</td><td><input value="${esc(s.substring(t.length+1))}"></td><td style="white-space:nowrap"><button class="b" onclick="edM(this)">Simpan</button> <button class="b r" onclick="dlM(this)">Hapus</button></td></tr>`).join('')).join('')}</table></div></div>`}
function mDone(r){D.mapel=r.mapel;$('#hm').innerHTML=mOpts();lm();if($('#hm').value){hk();stat()}toast(r.msg);aMapel()}
async function addM(){mDone(await rpc('addMapel',TOK,$('#mt').value,$('#mn').value))}
async function edM(b){const tr=b.closest('tr');mDone(await rpc('editMapel',TOK,tr.dataset.s,tr.querySelector('input').value))}
async function dlM(b){if(!confirm('Hapus mata pelajaran ini beserta seluruh nilainya?'))return;mDone(await rpc('delMapel',TOK,b.closest('tr').dataset.s))}
function aWali(){$('#ab').innerHTML=`<div class="card"><button class="b g" onclick="svW()">💾 Simpan Semua</button><div class="sc" style="margin-top:12px"><table class="t"><tr><th>Kelas</th><th>Nama Wali Kelas</th><th>NIP</th></tr>${D.kelas.map(k=>{const w=D.wali[k.k]||['',''];return `<tr><td>${k.k}</td><td><input value="${esc(w[0])}"></td><td><input value="${esc(w[1])}"></td></tr>`}).join('')}</table></div></div>`}
async function svW(){const rows=$$('#ab tr').slice(1).map(tr=>{const i=tr.querySelectorAll('input');return [tr.cells[0].textContent,i[0].value,"'"===''?'':String(i[1].value)]});
 toast(await rpc('saveWali',TOK,rows));rows.forEach(r=>D.wali[r[0]]=[r[1],r[2]])}
